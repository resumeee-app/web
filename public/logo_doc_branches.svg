<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="resumeee-logo-title resumeee-logo-desc">
  <title id="resumeee-logo-title">Resumeee Logo</title>
  <desc id="resumeee-logo-desc">A resume document combined with a career graph that forks from a single master node into three tailored resume branches, accented with an AI tailoring spark.</desc>
  <defs>
    <linearGradient id="resumeee-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="55%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="resumeee-doc" x1="14" y1="12" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="resumeee-branch-top" x1="22" y1="44" x2="48" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="resumeee-branch-mid" x1="22" y1="44" x2="48" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="resumeee-branch-bot" x1="22" y1="44" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#resumeee-bg)" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Subtle Background Branching Folio Card (Layered Version Shadow) -->
  <rect x="17" y="10" width="32" height="40" rx="5" transform="rotate(5 33 30)" fill="#818CF8" fill-opacity="0.22" />

  <!-- Canonical Master Resume Document Sheet -->
  <path d="M13 15C13 12.7909 14.7909 11 17 11H35.3431C36.404 11 37.4214 11.4214 38.1716 12.1716L43.8284 17.8284C44.5786 18.5786 45 19.596 45 20.6569V49C45 51.2091 43.2091 53 41 53H17C14.7909 53 13 51.2091 13 49V15Z" fill="url(#resumeee-doc)" />

  <!-- Folded Document Corner -->
  <path d="M35 11V17C35 18.6569 36.3431 20 38 20H45" fill="#C7D2FE" />

  <!-- Subtle Resume Header Lines (Profile Summary Seam) -->
  <rect x="18" y="17" width="12" height="2.5" rx="1.25" fill="#94A3B8" fill-opacity="0.65" />
  <rect x="18" y="21.5" width="8" height="2" rx="1" fill="#CBD5E1" />

  <!-- Career Graph Forking into 3 Tailored Branches ("e-e-e") -->
  <!-- Branch 1 (Top - Active AI-Tailored Branch) -->
  <path d="M21 44V34C21 26.5 29 22 48 20" stroke="url(#resumeee-branch-top)" stroke-width="3.2" stroke-linecap="round" />
  <!-- Branch 2 (Middle - Role/Preset Branch) -->
  <path d="M21 44C21 35.5 31 32 48 32" stroke="url(#resumeee-branch-mid)" stroke-width="3.2" stroke-linecap="round" />
  <!-- Branch 3 (Bottom - Multi-Language/Template Branch) -->
  <path d="M21 44H48" stroke="url(#resumeee-branch-bot)" stroke-width="3.2" stroke-linecap="round" />

  <!-- Master Career Graph Root Node (Single Source of Truth) -->
  <circle cx="21" cy="44" r="4.5" fill="#312E81" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="21" cy="44" r="1.75" fill="#38BDF8" />

  <!-- Three Tailored Output Nodes (The Three "e"s of Resumeee) -->
  <circle cx="48" cy="20" r="4" fill="#38BDF8" stroke="#1E1B4B" stroke-width="1.75" />
  <circle cx="48" cy="32" r="3.75" fill="#818CF8" stroke="#1E1B4B" stroke-width="1.75" />
  <circle cx="48" cy="44" r="3.75" fill="#C084FC" stroke="#1E1B4B" stroke-width="1.75" />

  <!-- AI Synthesis / ATS Verification Spark at Top Branch -->
  <path d="M53.5 10.5L54.65 13.85L58 15L54.65 16.15L53.5 19.5L52.35 16.15L49 15L52.35 13.85L53.5 10.5Z" fill="#38BDF8" />
</svg>
