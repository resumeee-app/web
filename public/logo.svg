<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title-git-tree desc-git-tree">
  <title id="title-git-tree">Resumeee Logo — Git-Branching Monogram R</title>
  <desc id="desc-git-tree">A geometric letter R built from a Git commit trunk that loops through a master profile node and forks into three parallel resume branches.</desc>
  <defs>
    <linearGradient id="gt-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="gt-trunk" x1="18" y1="14" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="gt-loop" x1="18" y1="14" x2="46" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Dark Developer-First Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#gt-bg)" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Upper Loop of the "R" (Master Profile Cycle) -->
  <path d="M18 16H34C39.5228 16 44 20.4772 44 26C44 31.5228 39.5228 36 34 36H18" stroke="url(#gt-loop)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Three Forking Branch Legs of the "R" ("e-e-e" Variants) -->
  <!-- Leg 1: Outer Cyan Branch -->
  <path d="M31 36C36 36 41 40 48 44" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round" />
  <!-- Leg 2: Middle Indigo Branch -->
  <path d="M27 36C33 38 38 44 44 50" stroke="#818CF8" stroke-width="3.2" stroke-linecap="round" />
  <!-- Leg 3: Inner Purple Branch -->
  <path d="M23 36C28 40 31 46 35 52" stroke="#C084FC" stroke-width="3.2" stroke-linecap="round" />

  <!-- Main Vertical Trunk Spine (Master Career Graph) -->
  <line x1="18" y1="16" x2="18" y2="50" stroke="url(#gt-trunk)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Git Commit Nodes -->
  <circle cx="18" cy="16" r="4.5" fill="#0F172A" stroke="#38BDF8" stroke-width="3" />
  <circle cx="18" cy="36" r="4.5" fill="#0F172A" stroke="#818CF8" stroke-width="3" />
  <circle cx="18" cy="50" r="4" fill="#0F172A" stroke="#A855F7" stroke-width="2.75" />

  <!-- Three Tailored Branch Head Nodes -->
  <circle cx="48" cy="44" r="3.5" fill="#38BDF8" />
  <circle cx="44" cy="50" r="3.5" fill="#818CF8" />
  <circle cx="35" cy="52" r="3.5" fill="#C084FC" />
</svg>
