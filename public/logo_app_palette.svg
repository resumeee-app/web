<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title-app-palette desc-app-palette">
  <title id="title-app-palette">Resumeee Logo — Application Color Palette Edition (Dark)</title>
  <desc id="desc-app-palette">The Git-Branching Monogram R styled with the exact Resumeee application palette: Slate 950/900 base, Indigo 600/400 trunk and loop, and Emerald 400, Indigo 400, and Amber 400 branch tracks.</desc>
  <defs>
    <!-- Slate 950 (#020617) to Slate 900 (#0F172A) with Indigo 950 (#1E1B4B) depth -->
    <linearGradient id="ap-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <!-- Trunk: Emerald 400 (#34D399) -> Indigo 500 (#6366F1) -> Amber 400 (#FBBF24) -->
    <linearGradient id="ap-trunk" x1="18" y1="16" x2="18" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <!-- Loop: Primary Blue (#2563EB) -> Indigo 500 (#6366F1) -> Indigo 400 (#818CF8) -->
    <linearGradient id="ap-loop" x1="18" y1="16" x2="44" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- App Squircle Base (Slate 950/900 + Slate 800/Indigo 500 Border) -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#ap-bg)" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" stroke="#6366F1" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Three Forking Branch Legs using Application Semantic Colors -->
  <!-- Leg 1: Emerald 400 (#34D399 — Verified / Ready Branch) -->
  <path d="M31 36C36 36 41 40 48 44" stroke="#34D399" stroke-width="3.2" stroke-linecap="round" />
  <!-- Leg 2: Indigo 400 (#818CF8 — Core Brand Tailored Branch) -->
  <path d="M27 36C33 38 38 44 44 50" stroke="#818CF8" stroke-width="3.2" stroke-linecap="round" />
  <!-- Leg 3: Amber 400 (#FBBF24 — Active Synthesis / Strategy Preset Branch) -->
  <path d="M23 36C28 40 31 46 35 52" stroke="#FBBF24" stroke-width="3.2" stroke-linecap="round" />

  <!-- Upper Loop of the "R" (Master Profile Cycle) -->
  <path d="M18 16H34C39.5228 16 44 20.4772 44 26C44 31.5228 39.5228 36 34 36H18" stroke="url(#ap-loop)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Main Vertical Trunk Spine (Master Career Graph) -->
  <line x1="18" y1="16" x2="18" y2="50" stroke="url(#ap-trunk)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Git Commit Nodes on Trunk -->
  <circle cx="18" cy="16" r="4.5" fill="#0F172A" stroke="#34D399" stroke-width="3" />
  <circle cx="18" cy="36" r="4.5" fill="#0F172A" stroke="#6366F1" stroke-width="3" />
  <circle cx="18" cy="50" r="4" fill="#0F172A" stroke="#FBBF24" stroke-width="2.75" />

  <!-- Three Tailored Branch Head Nodes (Emerald 400, Indigo 400, Amber 400) -->
  <circle cx="48" cy="44" r="3.5" fill="#34D399" />
  <circle cx="44" cy="50" r="3.5" fill="#818CF8" />
  <circle cx="35" cy="52" r="3.5" fill="#FBBF24" />
</svg>
