<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" role="img" aria-labelledby="resumeee-wordmark-title resumeee-wordmark-desc">
  <title id="resumeee-wordmark-title">Resumeee — Career Graph &amp; Multi-Branch Resume Tailoring</title>
  <desc id="resumeee-wordmark-desc">Resumeee brand mark featuring the Git-Branching Monogram R alongside the Resumeee wordmark with triple-e branch highlights.</desc>
  <defs>
    <linearGradient id="wm-gt-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="wm-gt-trunk" x1="18" y1="14" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="wm-gt-loop" x1="18" y1="14" x2="46" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="wm-eee-grad" x1="196" y1="18" x2="266" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Git-Tree Monogram R Emblem -->
  <g>
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#wm-gt-bg)" />
    <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1.5" />
    <path d="M18 16H34C39.5228 16 44 20.4772 44 26C44 31.5228 39.5228 36 34 36H18" stroke="url(#wm-gt-loop)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M31 36C36 36 41 40 48 44" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round" />
    <path d="M27 36C33 38 38 44 44 50" stroke="#818CF8" stroke-width="3.2" stroke-linecap="round" />
    <path d="M23 36C28 40 31 46 35 52" stroke="#C084FC" stroke-width="3.2" stroke-linecap="round" />
    <line x1="18" y1="16" x2="18" y2="50" stroke="url(#wm-gt-trunk)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="18" cy="16" r="4.5" fill="#0F172A" stroke="#38BDF8" stroke-width="3" />
    <circle cx="18" cy="36" r="4.5" fill="#0F172A" stroke="#818CF8" stroke-width="3" />
    <circle cx="18" cy="50" r="4" fill="#0F172A" stroke="#A855F7" stroke-width="2.75" />
    <circle cx="48" cy="44" r="3.5" fill="#38BDF8" />
    <circle cx="44" cy="50" r="3.5" fill="#818CF8" />
    <circle cx="35" cy="52" r="3.5" fill="#C084FC" />
  </g>

  <!-- Wordmark: "Resum" + Triple-Branch "eee" -->
  <text x="76" y="42" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.03em" fill="#0F172A">
    Resum<tspan fill="url(#wm-eee-grad)">eee</tspan>
  </text>
</svg>
