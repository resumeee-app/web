<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title-career-graph desc-career-graph">
  <title id="title-career-graph">Resumeee Logo — Career Graph &amp; Provenance Constellation</title>
  <desc id="desc-career-graph">A hexagonal career knowledge graph connecting experiences, skills, projects, and facts into a central resume node.</desc>
  <defs>
    <linearGradient id="cg-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cg-hex" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#cg-bg)" />

  <!-- Outer Hexagonal Graph Ring (Provenance Perimeter) -->
  <polygon points="32,10 51,21 51,43 32,54 13,43 13,21" stroke="url(#cg-hex)" stroke-width="2.2" stroke-opacity="0.7" fill="#312E81" fill-opacity="0.25" />

  <!-- Bidirectional Provenance Edges Connecting Satellite Nodes to Center Document -->
  <line x1="32" y1="10" x2="32" y2="23" stroke="#38BDF8" stroke-width="2" />
  <line x1="51" y1="21" x2="40" y2="27" stroke="#38BDF8" stroke-width="2" />
  <line x1="51" y1="43" x2="40" y2="37" stroke="#818CF8" stroke-width="2" />
  <line x1="32" y1="54" x2="32" y2="41" stroke="#C084FC" stroke-width="2" />
  <line x1="13" y1="43" x2="24" y2="37" stroke="#818CF8" stroke-width="2" />
  <line x1="13" y1="21" x2="24" y2="27" stroke="#38BDF8" stroke-width="2" />

  <!-- Central Master Resume Core -->
  <rect x="23" y="21" width="18" height="22" rx="3.5" fill="#FFFFFF" stroke="#6366F1" stroke-width="2" />
  <rect x="26.5" y="26" width="11" height="2.2" rx="1.1" fill="#38BDF8" />
  <rect x="26.5" y="30.8" width="9" height="2.2" rx="1.1" fill="#6366F1" />
  <rect x="26.5" y="35.6" width="7" height="2.2" rx="1.1" fill="#A855F7" />

  <!-- Six Career Graph Satellite Nodes (Experiences, Skills, Projects, Education, Facts, Presets) -->
  <circle cx="32" cy="10" r="3.75" fill="#38BDF8" stroke="#0F172A" stroke-width="1.5" />
  <circle cx="51" cy="21" r="3.5" fill="#60A5FA" stroke="#0F172A" stroke-width="1.5" />
  <circle cx="51" cy="43" r="3.5" fill="#818CF8" stroke="#0F172A" stroke-width="1.5" />
  <circle cx="32" cy="54" r="3.75" fill="#C084FC" stroke="#0F172A" stroke-width="1.5" />
  <circle cx="13" cy="43" r="3.5" fill="#818CF8" stroke="#0F172A" stroke-width="1.5" />
  <circle cx="13" cy="21" r="3.5" fill="#60A5FA" stroke="#0F172A" stroke-width="1.5" />
</svg>
