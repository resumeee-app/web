<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title-app-palette-light desc-app-palette-light">
  <title id="title-app-palette-light">Resumeee Logo — Application Color Palette Edition (Light)</title>
  <desc id="desc-app-palette-light">Light-mode variant of the Git-Branching Monogram R styled with Slate 50/100 surface, Indigo 600/500 loop, and Emerald 600, Indigo 600, and Amber 600 branch tracks.</desc>
  <defs>
    <linearGradient id="apl-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="apl-trunk" x1="18" y1="16" x2="18" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="apl-loop" x1="18" y1="16" x2="44" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Light Squircle Base (White to Slate 100 + Slate 200 Border) -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#apl-bg)" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Three Forking Branch Legs (Light Mode 600-level Contrast Tokens) -->
  <!-- Leg 1: Emerald 600 (#059669) -->
  <path d="M31 36C36 36 41 40 48 44" stroke="#059669" stroke-width="3.2" stroke-linecap="round" />
  <!-- Leg 2: Indigo 600 (#4F46E5) -->
  <path d="M27 36C33 38 38 44 44 50" stroke="#4F46E5" stroke-width="3.2" stroke-linecap="round" />
  <!-- Leg 3: Amber 600 (#D97706) -->
  <path d="M23 36C28 40 31 46 35 52" stroke="#D97706" stroke-width="3.2" stroke-linecap="round" />

  <!-- Upper Loop of the "R" -->
  <path d="M18 16H34C39.5228 16 44 20.4772 44 26C44 31.5228 39.5228 36 34 36H18" stroke="url(#apl-loop)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Main Vertical Trunk Spine -->
  <line x1="18" y1="16" x2="18" y2="50" stroke="url(#apl-trunk)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Git Commit Nodes on Trunk -->
  <circle cx="18" cy="16" r="4.5" fill="#FFFFFF" stroke="#059669" stroke-width="3" />
  <circle cx="18" cy="36" r="4.5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3" />
  <circle cx="18" cy="50" r="4" fill="#FFFFFF" stroke="#D97706" stroke-width="2.75" />

  <!-- Three Tailored Branch Head Nodes -->
  <circle cx="48" cy="44" r="3.5" fill="#059669" />
  <circle cx="44" cy="50" r="3.5" fill="#4F46E5" />
  <circle cx="35" cy="52" r="3.5" fill="#D97706" />
</svg>
