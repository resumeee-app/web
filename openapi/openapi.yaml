openapi: 3.1.0
info:
  title: Resumeee REST API
  version: 0.1.0
  description: >-
    Headless resume tailoring and career graph engine. Provides Main Profile
    CRUD with transactional atomic revision tracking, reusable presets,
    multi-format Go templates (HTML, Markdown, Plain Text), dynamic resume
    branches, asynchronous LLM generation with provenance validation ("No
    Lies"), and rendered artifact exports.
servers:
  - url: /api/v1
    description: Primary API v1 endpoint

tags:
  - name: Main Profile
    description: Operations on root user profile, career snapshot, and JSON Resume import/export
  - name: Career Entities
    description: Granular career graph entities (skills, experiences, projects, education, certs, facts)
  - name: Presets & Templates
    description: Tier-2 reusable instruction presets and database-stored Go template sets
  - name: Branches & Versions
    description: Tier-3 tailored resume lines, asynchronous generation, and immutable version snapshots
  - name: System
    description: Service health, liveness probes, and diagnostics

paths:
  /models:
    get:
      tags:
        - System
      summary: List available LLM models
      description: >-
        Returns all configured LLM providers and their supported models based on active
        environment credentials. Only providers with active API keys or endpoints are returned.
        Zero credential leakage invariant.
      operationId: listAvailableModels
      responses:
        '200':
          description: List of available model options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelOption'
  /health:
    get:
      tags:
        - System
      summary: Service health check
      description: Returns service liveness and operational health status.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy and operational
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
  /quota:
    get:
      tags:
        - System
      summary: Get tenant LLM quota and usage status
      description: >-
        Returns the authenticated tenant's current daily request and monthly token quota status,
        including usage counters, remaining capacity, and window reset timestamps.
      operationId: getQuota
      responses:
        '200':
          description: Tenant quota retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantQuota'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /profile:
    get:
      tags:
        - Main Profile
      summary: Get user main profile
      operationId: getProfile
      responses:
        '200':
          description: Main profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Main Profile
      summary: Update main profile
      description: Updates basic profile details, contact info, default LLM provider/model, or Tier-1 global rules. Atomically increments main_revision.
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated and revision incremented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /profile/full:
    get:
      tags:
        - Main Profile
      summary: Get full main profile career graph
      description: Returns the complete career graph snapshot including profile, all skills, experiences, projects, education, certifications, and polymorphic facts.
      operationId: getFullProfile
      responses:
        '200':
          description: Complete career graph snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainProfileSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /profile/jsonresume/import:
    post:
      tags:
        - Main Profile
      summary: Import standard JSON Resume payload
      description: Ingests an external JSON Resume schema payload into the Main Profile, replacing or merging career records and incrementing main_revision.
      operationId: importJSONResume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Standard JSON Resume compliant object
      responses:
        '200':
          description: Successfully imported JSON Resume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainProfileSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /profile/jsonresume/export:
    get:
      tags:
        - Main Profile
      summary: Export career data in standard JSON Resume format
      description: Exports either the Main Profile or a specific tailored branch version formatted according to the standard JSON Resume schema.
      operationId: exportJSONResume
      parameters:
        - name: version_id
          in: query
          required: false
          description: Optional branch version UUID. If omitted, exports current Main Profile.
          schema:
            type: string
      responses:
        '200':
          description: Exported JSON Resume document
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /profile/pdf/parse:
    post:
      tags:
        - Main Profile
      summary: Parse PDF resume using LLM
      description: Extracts raw text from an uploaded PDF resume (max 10MB) and invokes structured LLM extraction into candidate JSON Resume format for interactive staging and review.
      operationId: parsePDFResume
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Binary PDF resume file to parse (max 10MB)
                provider:
                  type: string
                  description: Optional LLM provider override
                model:
                  type: string
                  description: Optional LLM model override
      responses:
        '200':
          description: Successfully parsed PDF into candidate JSON Resume (synchronous mode)
          content:
            application/json:
              schema:
                type: object
                description: Candidate JSON Resume draft
        '202':
          description: PDF parsing job queued for asynchronous background processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncPDFJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /profile/pdf/jobs/{id}:
    get:
      tags:
        - Main Profile
      summary: Get asynchronous PDF parse job status and candidate result
      description: Returns the lifecycle state and candidate JSON Resume result of an asynchronous PDF parsing job.
      operationId: getPDFParseJob
      parameters:
        - name: id
          in: path
          required: true
          description: Unique PDF parse job identifier
          schema:
            type: string
      responses:
        '200':
          description: PDF parse job state and result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PDFParseJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /profile/pdf/commit:
    post:
      tags:
        - Main Profile
      summary: Commit reviewed PDF resume into Main Profile
      description: Ingests verified/edited JSON Resume draft, updates the Main Profile career graph, initializes profile for new users if not previously present, and increments main_revision.
      operationId: commitPDFResume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Standard JSON Resume compliant object
      responses:
        '200':
          description: Successfully committed resume into Main Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainProfileSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /skills:
    get:
      tags:
        - Career Entities
      summary: List all skills
      operationId: listSkills
      parameters:
        - name: type
          in: query
          required: false
          description: Filter skills by origin type (all returns union of custom and global, global returns system-seeded skills, custom returns tenant-owned skills)
          schema:
            type: string
            enum:
              - all
              - global
              - custom
            default: all
      responses:
        '200':
          description: List of main skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Career Entities
      summary: Create a new skill
      description: Adds a skill and atomically increments main_revision.
      operationId: createSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSkillRequest'
      responses:
        '201':
          description: Skill created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /skills/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags:
        - Career Entities
      summary: Get skill by ID
      operationId: getSkill
      responses:
        '200':
          description: Skill details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Career Entities
      summary: Update skill
      description: Updates a skill and atomically increments main_revision.
      operationId: updateSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSkillRequest'
      responses:
        '200':
          description: Skill updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Career Entities
      summary: Delete skill
      description: Deletes a skill and atomically increments main_revision.
      operationId: deleteSkill
      responses:
        '204':
          description: Skill deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /experiences:
    get:
      tags:
        - Career Entities
      summary: List all work experiences
      operationId: listExperiences
      responses:
        '200':
          description: List of work experiences with polymorphic facts and linked skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkExperience'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Career Entities
      summary: Create work experience
      description: Adds a work experience entry and atomically increments main_revision.
      operationId: createExperience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperienceRequest'
      responses:
        '201':
          description: Work experience created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkExperience'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /experiences/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags:
        - Career Entities
      summary: Get work experience by ID
      operationId: getExperience
      responses:
        '200':
          description: Work experience details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkExperience'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Career Entities
      summary: Update work experience
      description: Updates work experience and atomically increments main_revision.
      operationId: updateExperience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExperienceRequest'
      responses:
        '200':
          description: Work experience updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkExperience'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Career Entities
      summary: Delete work experience
      description: Deletes work experience, associated polymorphic facts, and increments main_revision.
      operationId: deleteExperience
      responses:
        '204':
          description: Work experience deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects:
    get:
      tags:
        - Career Entities
      summary: List all projects
      operationId: listProjects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Career Entities
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags:
        - Career Entities
      summary: Get project by ID
      operationId: getProject
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Career Entities
      summary: Update project
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Career Entities
      summary: Delete project
      operationId: deleteProject
      responses:
        '204':
          description: Project deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /education:
    get:
      tags:
        - Career Entities
      summary: List all education records
      operationId: listEducation
      responses:
        '200':
          description: List of education credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Education'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Career Entities
      summary: Create education entry
      operationId: createEducation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEducationRequest'
      responses:
        '201':
          description: Education entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Education'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /education/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags:
        - Career Entities
      summary: Get education entry by ID
      operationId: getEducation
      responses:
        '200':
          description: Education entry details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Education'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Career Entities
      summary: Update education entry
      operationId: updateEducation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEducationRequest'
      responses:
        '200':
          description: Education entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Education'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Career Entities
      summary: Delete education entry
      operationId: deleteEducation
      responses:
        '204':
          description: Education entry deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /certifications:
    get:
      tags:
        - Career Entities
      summary: List all certifications
      operationId: listCertifications
      responses:
        '200':
          description: List of certifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Certification'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Career Entities
      summary: Create certification
      operationId: createCertification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificationRequest'
      responses:
        '201':
          description: Certification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /certifications/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags:
        - Career Entities
      summary: Get certification by ID
      operationId: getCertification
      responses:
        '200':
          description: Certification details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certification'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Career Entities
      summary: Update certification
      operationId: updateCertification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCertificationRequest'
      responses:
        '200':
          description: Certification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Career Entities
      summary: Delete certification
      operationId: deleteCertification
      responses:
        '204':
          description: Certification deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /facts:
    get:
      tags:
        - Career Entities
      summary: List facts by owner
      description: Retrieves polymorphic facts filtered by owner entity type and owner entity UUID.
      operationId: listFacts
      parameters:
        - name: owner_type
          in: query
          required: true
          description: Entity type owning the fact
          schema:
            $ref: '#/components/schemas/OwnerType'
        - name: owner_id
          in: query
          required: true
          description: UUID of the owning entity
          schema:
            type: string
      responses:
        '200':
          description: List of facts matching owner criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Career Entities
      summary: Create granular fact
      description: Creates an atomic achievement or responsibility bullet and attaches relational skill IDs. Increments main_revision.
      operationId: createFact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFactRequest'
      responses:
        '201':
          description: Fact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /facts/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags:
        - Career Entities
      summary: Get fact by ID
      operationId: getFact
      responses:
        '200':
          description: Fact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Career Entities
      summary: Update fact
      description: Updates statement, impact metric, or skill associations, incrementing main_revision.
      operationId: updateFact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFactRequest'
      responses:
        '200':
          description: Fact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Career Entities
      summary: Delete fact
      description: Deletes fact and increments main_revision.
      operationId: deleteFact
      responses:
        '204':
          description: Fact deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /presets:
    get:
      tags:
        - Presets & Templates
      summary: List presets
      description: Lists Tier-2 reusable instruction configurations.
      operationId: listPresets
      responses:
        '200':
          description: List of presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preset'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Presets & Templates
      summary: Create preset
      operationId: createPreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePresetRequest'
      responses:
        '201':
          description: Preset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /presets/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags:
        - Presets & Templates
      summary: Get preset by ID
      operationId: getPreset
      responses:
        '200':
          description: Preset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preset'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Presets & Templates
      summary: Update preset
      operationId: updatePreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePresetRequest'
      responses:
        '200':
          description: Preset updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preset'
        '400':
