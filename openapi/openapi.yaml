components:
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      description: Unique UUID identifier of the entity
      schema:
        type: string

  responses:
    Unauthorized:
      description: Authentication required or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Missing or invalid Authorization header

    BadRequest:
      description: Invalid request payload or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_REQUEST
              message: Missing required field full_name

    NotFound:
      description: Requested entity does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Resource with specified ID was not found

    Forbidden:
      description: Action is forbidden (e.g. attempting to modify or delete built-in system presets)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Built-in system presets cannot be modified or deleted

    TemplateValidationError:
      description: Go template failed syntax or security validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TEMPLATE_VALIDATION_ERROR
              message: template syntax error in html_template
              details: "template: html:12: function 'exec' not defined"

    ProvenanceError:
      description: Provenance validation failure ("No Lies" invariant)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: PROVENANCE_ERROR
              message: Source entity or fact UUID does not exist in user Main Profile
              details: "invalid source_fact_id: fact-999"

    QueueFull:
      description: In-memory worker queue channel is at maximum capacity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: QUEUE_FULL
              message: Background generation queue is full; retry with backoff

    InternalError:
      description: Unexpected internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: An internal error occurred while processing the request

    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: Version generation is still in progress

    UnprocessableEntity:
      description: Unprocessable entity state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNPROCESSABLE_ENTITY
              message: Version does not have tailored content to render

    TooManyRequests:
      description: Tenant daily request or monthly token quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: QUOTA_EXCEEDED
              message: Daily LLM request quota exceeded

  schemas:
    TenantQuota:
      type: object
      required:
        - user_id
        - daily_requests_used
        - daily_request_limit
        - daily_window_start
        - monthly_tokens_used
        - monthly_token_limit
        - monthly_window_start
        - daily_requests_remaining
        - monthly_tokens_remaining
        - daily_reset_at
        - monthly_reset_at
        - updated_at
      properties:
        user_id:
          type: string
          description: Unique tenant identifier
        daily_requests_used:
          type: integer
          description: Number of LLM generation and parse requests executed in current daily window
        daily_request_limit:
          type: integer
          description: Maximum allowed LLM requests in a 24-hour window
        daily_window_start:
          type: string
          format: date-time
          description: Timestamp when the current 24-hour daily request quota window began
        monthly_tokens_used:
          type: integer
          description: Cumulative tokens consumed across all LLM operations in current monthly window
        monthly_token_limit:
          type: integer
          description: Maximum allowed LLM tokens in a 30-day billing window
        monthly_window_start:
          type: string
          format: date-time
          description: Timestamp when the current 30-day monthly token quota window began
        daily_requests_remaining:
          type: integer
          description: Remaining allowed LLM requests before daily rate limit is enforced
        monthly_tokens_remaining:
          type: integer
          description: Remaining allowed LLM tokens before monthly ceiling is enforced
        daily_reset_at:
          type: string
          format: date-time
          description: Expected timestamp when the daily request window resets
        monthly_reset_at:
          type: string
          format: date-time
          description: Expected timestamp when the monthly token window resets
        updated_at:
          type: string
          format: date-time
          description: Timestamp when quota counters were last modified
    ModelOption:
      type: object
      required:
        - provider
        - model
        - display_name
        - is_default
      properties:
        provider:
          type: string
          example: gemini
          description: LLM provider identifier (e.g. gemini, openai, anthropic, compat)
        model:
          type: string
          example: gemini-3.8-flash
          description: Specific model name identifier
        display_name:
          type: string
          example: Google Gemini — gemini-3.8-flash
          description: Human-readable provider and model label for UI dropdowns
        is_default:
