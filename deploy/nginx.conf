server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Global Security Headers
    # Note: In NGINX, defining add_header in a child location block drops all parent add_header directives.
    # Therefore, security headers must be re-declared in every location block that adds headers (e.g. Cache-Control).
    include /etc/nginx/security_headers.conf;

    # API Proxy pass to Go backend service (uses Docker DNS resolver with dynamic resolution)
    location /api/ {
        resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;
        set $backend_api http://server:8080;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed static assets - aggressive 1-year caching
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Client-Side Routing Fallback: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
